<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YAKKUM – Human Resources Request Form</title>
  <style>
    :root {
      --biru: #1a56a0;
      --biru-muda: #e8f0fb;
      --hijau: #1a7a4a;
      --merah: #c0392b;
      --abu: #f5f6fa;
      --border: #d1d5db;
      --teks: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--abu); color: var(--teks); }

    /* HEADER */
    .header {
      background: var(--biru);
      color: white;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header-logo {
      width: 54px; height: 54px;
      background: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 900; color: var(--biru);
      flex-shrink: 0;
    }
    .header-title h1 { font-size: 1.3rem; font-weight: 700; }
    .header-title p  { font-size: 0.82rem; opacity: 0.85; margin-top: 2px; }

    /* CONTAINER */
    .container { max-width: 860px; margin: 32px auto; padding: 0 16px 60px; }

    /* STEP INDICATOR */
    .steps {
      display: flex; justify-content: space-between;
      position: relative; margin-bottom: 32px;
    }
    .steps::before {
      content: '';
      position: absolute; top: 20px; left: 10%; right: 10%;
      height: 3px; background: var(--border); z-index: 0;
    }
    .step {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; z-index: 1; width: 20%;
    }
    .step-circle {
      width: 40px; height: 40px; border-radius: 50%;
      background: white; border: 3px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.95rem; color: #9ca3af;
      transition: all 0.3s;
    }
    .step.active   .step-circle { background: var(--biru); border-color: var(--biru); color: white; }
    .step.done     .step-circle { background: var(--hijau); border-color: var(--hijau); color: white; }
    .step-label { font-size: 0.7rem; text-align: center; color: #6b7280; font-weight: 500; }
    .step.active .step-label { color: var(--biru); font-weight: 700; }
    .step.done   .step-label { color: var(--hijau); }

    /* CARD */
    .card {
      background: white; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 32px; margin-bottom: 20px;
    }
    .card-title {
      font-size: 1.1rem; font-weight: 700;
      color: var(--biru); margin-bottom: 20px;
      padding-bottom: 10px; border-bottom: 2px solid var(--biru-muda);
      display: flex; align-items: center; gap: 8px;
    }

    /* FORM */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid.full { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.span2 { grid-column: span 2; }
    label { font-size: 0.83rem; font-weight: 600; color: #374151; }
    label .req { color: var(--merah); margin-left: 2px; }
    input, select, textarea {
      padding: 9px 12px; border: 1.5px solid var(--border);
      border-radius: 7px; font-size: 0.9rem; color: var(--teks);
      transition: border-color 0.2s; background: white;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--biru);
      box-shadow: 0 0 0 3px rgba(26,86,160,0.1);
    }
    textarea { resize: vertical; min-height: 90px; }
    .hint { font-size: 0.75rem; color: #6b7280; margin-top: 2px; }

    /* DIRECTORATE TABS */
    .dir-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .dir-tab {
      padding: 8px 16px; border-radius: 20px; border: 2px solid var(--border);
      background: white; cursor: pointer; font-size: 0.83rem; font-weight: 600;
      transition: all 0.2s; color: #6b7280;
    }
    .dir-tab.active { border-color: var(--biru); background: var(--biru); color: white; }
    .dir-panel { display: none; }
    .dir-panel.active { display: block; }

    /* APPROVAL CHAIN */
    .approval-item {
      background: var(--biru-muda); border-radius: 8px;
      padding: 14px 16px; margin-bottom: 12px;
      border-left: 4px solid var(--biru);
    }
    .approval-item.required { border-left-color: var(--merah); }
    .approval-level {
      font-size: 0.75rem; font-weight: 700;
      color: var(--biru); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .approval-item.required .approval-level { color: var(--merah); }

    /* BUTTONS */
    .btn-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
    .btn {
      padding: 10px 28px; border-radius: 8px; border: none;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
